name: CI/CD Pipeline for WebApplication1

on:
  push:
    branches: [ "**" ]
  pull_request:

env:
  DOTNET_VERSION: '8.0.x'
  # ВИПРАВЛЕНО: Використовуємо відносні шляхи
  API_PROJECT_PATH: 'WebApplication1/WebApplication1.csproj'
  TEST_PROJECT_PATH: 'WebApplication1.Tests/WebApplication1.Tests.csproj'

jobs:
  # --- Крок 2: Запуск Unit-тестів ---
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore
      run: dotnet restore
      
    - name: Run tests
      # ВИПРАВЛЕНО: Прибираємо прапорець --no-restore, оскільки він викликає помилки. 
      # Запускаємо з конфігурацією Release.
      run: dotnet test ${{ env.TEST_PROJECT_PATH }} -c Release

  # --- Збірка проєкту ---
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: [test] 
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore
      run: dotnet restore
      
    - name: Publish
      # Шлях береться з env.API_PROJECT_PATH
      run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o ./dist
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: ./dist

  # --- Крок 3: Інтеграція Postman ---
  api-test:
    name: Run Postman (API) Tests
    runs-on: ubuntu-latest
    needs: [build] 
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: app-build
        path: ./dist
        
    - uses: actions/checkout@v4 
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Newman
      run: npm install -g newman

    - name: Start API in Background
      run: dotnet ./dist/WebApplication1.dll &
      
    - name: Wait for API
      run: sleep 15 

    - name: Run Postman Tests
      run: newman run ./docs/api/postman_collection.json

name: CI/CD Pipeline - API and Postman Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Або ваша версія .NET

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore

      # Опублікувати додаток для запуску
      - name: Publish Web Application
        run: dotnet publish WebApplication1/WebApplication1.csproj -c Release -o ./publish

      # Запустити додаток у фоновому режимі (Важливо: для CI)
      - name: Run Web Application in Background
        # Використовуємо 'nohup' та '&' для запуску у фоні
        run: |
          echo "Starting application..."
          # Запускаємо додаток на localhost:5105. Порт 5105 повинен бути вказаний у вашому коді (app.Run()) або в конфігурації.
          nohup dotnet ./publish/WebApplication1.dll --urls "http://localhost:5105" &
          echo "Waiting 5 seconds for server to start..."
          sleep 5 # Чекаємо, поки сервер повністю завантажиться
          echo "Server should be running now."

      # Встановлення Newman (консольний раннер Postman)
      - name: Install Newman
        run: npm install -g newman

      # Встановлення допоміжного інструменту для перевірки наявності файлів (для Newman)
      - name: Check for Postman files
        run: ls Postman/

      # Запуск тестів Postman
      # Запуск тестів Postman: Використовуємо --global-var
      - name: Run Postman Collection Tests
        run: |
          newman run "Postman/api_tests.json" \
            --global-var "baseURL=http://localhost:5105" \
            --reporters cli,json \
            --reporter-json-export "newman-report.json" \
            --insecure # Додаємо прапор для надійностіn"
        env:
          BASE_URL: http://localhost:5105 # Якщо ваше середовище Postman використовує {{baseURL}}
        # 'continue-on-error: true' можна використовувати, якщо потрібно, щоб пайплайн не падав відразу,
        # але для тестів це зазвичай не потрібно, вони повинні зупиняти пайплайн при помилці.
        
      # Додатково: Запуск Unit-тестів
      - name: Run Unit Tests (XUnit)
        run: dotnet test

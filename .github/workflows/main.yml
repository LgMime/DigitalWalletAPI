name: CI/CD Pipeline - API and Postman Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore

      - name: Publish Web Application
        run: dotnet publish DigitalWalletAPI/DigitalWalletAPI.csproj -c Release -o ./publish

      - name: Run Web Application in Background
        run: |
          echo "Starting application..."
          nohup dotnet ./publish/DigitalWalletAPI.dll --urls "http://localhost:5105" > app.log 2>&1 &
          echo "Waiting 5 seconds for server to start..."
          sleep 5
          echo "Server should be running now."

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection Tests
        run: |
          newman run "Postman/api_tests.json" \
            --reporters cli,json \
            --reporter-json-export "newman-report.json" \
            --insecure

      - name: Run Unit Tests (XUnit)
        run: dotnet test --no-build